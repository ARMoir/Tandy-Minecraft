name: Build and release MINE.EXE (16-bit DOS)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize successful publishers so one run cannot delete a newer release.
concurrency:
  group: mine-main-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Open Watcom 2.0
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          target: dos
      - name: Precompute compressed default Minecraft world on build host
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o worldgen tools/make_default_world.c src/rd.c
          ./worldgen src/rd_world_rle.h
          test -s src/rd_world_rle.h
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-world tools/test_world.c src/rd.c
          ./test-world
      - name: Generate original block textures in Tandy palette on host
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o atlasgen tools/make_tandy_atlas.c
          ./atlasgen src/rd_tandy_atlas.h
          test -s src/rd_tandy_atlas.h
      - name: Build true 8086-compatible 16-bit DOS executable
        shell: bash
        run: |
          set -euo pipefail
          wcl -bcl=dos -0 -ox -ml -zt256 -zastd=c99 -q -dRD_DOS16 -dRD_X=32 -dRD_Y=24 -dRD_Z=32 -dRD_MAX_PLAYERS=1 -fe=MINE.EXE platforms/dos16/mine.c platforms/dos16/mine_keys.c platforms/dos16/mine_hud.c platforms/dos16/mine_map.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          test -s MINE.EXE
          python3 - <<'PY'
          from pathlib import Path
          exe=Path("MINE.EXE").read_bytes()
          assert exe[:2] == b"MZ", "Not a real-mode DOS MZ executable"
          assert len(exe) < 500000, f"Unexpected size: {len(exe)}"
          print(f"MINE.EXE: DOS MZ, {len(exe)} bytes")
          PY
      - name: Check original core still renders on a modern host
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=2 -o test-snapshot tools/snapshot.c src/rd.c
          ./test-snapshot snapshot.ppm 1 5 40 25
          test -s snapshot.ppm
      - name: Validate fast integer voxel renderer on a host
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-fast tools/test_fast.c src/rd.c src/rd_fast.c src/rd_legacy.c
          ./test-fast
      - name: Validate fast terrain renderer on a host
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-terrain tools/test_terrain.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          ./test-terrain
      - name: Test enhanced 40x50 graphics readability
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-detail tools/test_terrain_detail.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          ./test-detail
      - name: Test balanced 40x40 terrain and DOS movement
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-mid tools/test_mid.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          ./test-mid
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-motion tools/test_dos_motion.c src/rd.c
          ./test-motion
      - name: Verify every Tandy key and camera horizon movement
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-keys tools/test_tandy_keys.c platforms/dos16/mine_keys.c
          ./test-keys
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-camera tools/test_tandy_camera.c platforms/dos16/mine_keys.c src/rd.c src/rd_fast.c src/rd_terrain.c
          ./test-camera
      - name: Validate material-faithful Tandy colors and terrain image
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-palette tools/test_tandy_palette.c
          ./test-palette
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-visual tools/test_tandy_visual.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          ./test-visual
      - name: Confirm one-block hills show dirt sides
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-steps tools/test_terrain_steps.c src/rd.c src/rd_fast.c src/rd_terrain.c src/rd_legacy.c
          ./test-steps
      - name: Test actual DOS digging and placing plus visible feedback
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-actions tools/test_dos_actions.c src/rd.c
          ./test-actions
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-hud tools/test_tandy_hud.c platforms/dos16/mine_hud.c
          ./test-hud
      - name: Verify responsive minimap tracks real position and orientation
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -O2 -DRD_DOS16 -DRD_X=32 -DRD_Y=24 -DRD_Z=32 -DRD_MAX_PLAYERS=1 -o test-map tools/test_tandy_map.c platforms/dos16/mine_map.c src/rd.c
          ./test-map
      - name: Upload DOS build
        uses: actions/upload-artifact@v4
        with:
          name: mine-dos16
          if-no-files-found: error
          path: |
            MINE.EXE
            platforms/dos16/README.TXT
            LICENSE

  release:
    name: Publish newest, then remove every older release and tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified DOS binary
        uses: actions/download-artifact@v4
        with:
          name: mine-dos16
      - name: Package DOS ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s MINE.EXE
          test -s LICENSE
          test -s platforms/dos16/README.TXT
          mkdir -p release
          cp MINE.EXE release/MINE.EXE
          cp LICENSE release/LICENSE
          cp platforms/dos16/README.TXT release/README.TXT
          (cd release && zip -q -9 MINE-DOS.zip MINE.EXE README.TXT LICENSE)
          unzip -t release/MINE-DOS.zip
      - name: Publish release and delete all earlier releases/tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: mine-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             release/MINE-DOS.zip release/MINE.EXE             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "MINE.EXE DOS build #$GITHUB_RUN_NUMBER"             --notes "Experimental Open Watcom real-mode DOS build from main ($GITHUB_SHA). Tested: compiler, DOS MZ format, and host-core rendering. Real Tandy V20 performance is not yet verified."             --latest
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100"             --jq '.[].tag_name' > "$RUNNER_TEMP/mine-tags.txt"
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$RELEASE_TAG" ]]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY"                 --yes --cleanup-tag
            fi
          done < "$RUNNER_TEMP/mine-tags.txt"
          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if [[ "$remaining" != "$RELEASE_TAG" ]]; then
            echo "::error::Old releases remain: $remaining"
            exit 1
          fi
